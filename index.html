// --- CASE STUDY ITEM (Q51) ---
const caseStudyData = {
    id: 51,
    title: "Clinical Case Study & SBAR Report",
    scenario: "A 56-year-old male client with a 15-year history of alcoholic cirrhosis is brought to the emergency department by his spouse. The spouse reports that over the past 48 hours, the client has become increasingly confused, is sleeping all day, and has experienced a foul, musty sweet odor on his breath. Today, his spouse noticed rapid, nonrhythmic flapping movements when trying to extend his wrists.\n\nAssessment Findings:\n- Vitals: T 98.2°F, BP 92/54 mmHg, HR 112 bpm, RR 22 breaths/min, SpO2 92% on room air.\n- Abdomen: Markedly distended with prominent umbilical caput medusae and shifting dullness. Abdominal girth measures 114 cm.\n- Neurologic: Lethargic, disoriented to time and place, displays bilateral asterixis. GCS is 13.\n- Labs: Serum ammonia 118 mcg/dL (elevated), ALT 42 U/L, AST 88 U/L, Total Bilirubin 3.2 mg/dL, Albumin 2.1 g/dL, INR 2.2, Hgb 9.8 g/dL.",

        { label: "S (Situation)", placeholder: "State the immediate clinical problem..." },
        { label: "B (Background)", placeholder: "Summarize relevant patient history and background..." },

        { label: "R (Recommendation)", placeholder: "Propose immediate nursing actions and medical interventions..." }
    ]
};

let currentQuestionIndex = 0;
let userAnswers = {};
let missedQuestions = [];

function initQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = `question-card ${index === 0 ? 'active' : ''}`;
        card.id = `question-${index}`;

        let optionsHtml = '';
        q.options.forEach((opt, oIndex) => {
            optionsHtml += `
                <li class="option-item" onclick="selectOption(${index}, ${oIndex}, '${q.type}')">
                    <input type="${q.type === 'sata' ? 'checkbox' : 'radio'}" name="q${index}" id="q${index}_opt${oIndex}">
                    <span>${opt.text}</span>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="question-number">Question ${index + 1} of ${quizData.length + 1}</div>
            <div class="question-stem">${q.stem}</div>
            <ul class="options-list">${optionsHtml}</ul>
            <button onclick="submitAnswer(${index})" id="submit-btn-${index}">Submit Answer</button>
            <div class="rationale-box" id="rationale-${index}">
                <strong>Rationale:</strong> ${q.rationale}
            </div>
        `;
        container.appendChild(card);
    });

    // Add Case Study Card (Q51)
    const caseCard = document.createElement('div');
    caseCard.className = `question-card`;
    caseCard.id = `question-${quizData.length}`;
    caseCard.innerHTML = `
        <div class="question-number">Clinical Case Study & SBAR Report (${quizData.length + 1} of ${quizData.length + 1})</div>
        <div class="question-stem">${caseStudyData.title}</div>
        <div class="case-study-box">${caseStudyData.scenario.replace(/\n/g, '<br>')}</div>
        <p><strong>Complete the SBAR Report below based on Chapter 50 clinical guidelines:</strong></p>
        ${caseStudyData.sbarPrompts.map((sbar, sIndex) => `
            <label><strong>${sbar.label}:</strong></label>
            <textarea class="sbar-input" id="sbar-${sIndex}" placeholder="${sbar.placeholder}"></textarea>
        `).join('')}
        <button onclick="submitCaseStudy(${quizData.length})" id="submit-btn-${quizData.length}">Submit Case Study & Finish Exam</button>
        <div class="rationale-box" id="rationale-${quizData.length}">
            <strong>Model SBAR Answer Key:</strong><br>
            • <strong>S:</strong> 56-year-old male with alcoholic cirrhosis presenting with acute confusion, lethargy, fetor hepaticus, and asterixis.<br>
            • <strong>B:</strong> 15-year-old history of alcoholic cirrhosis, now showing signs of decompensation and severe hepatic encephalopathy.<br>
            • <strong>A:</strong> BP 92/54, HR 112, SpO2 92%, ammonia 118 mcg/dL, INR 2.2, albumin 2.1 g/dL, marked ascites.<br>
            • <strong>R:</strong> Initiate fall/seizure precautions, administer lactulose as ordered, apply oxygen if needed, notify provider for urgent ammonia-lowering therapy and volume support.
        </div>
    `;
    container.appendChild(caseCard);

    updateProgress();
}

function selectOption(qIndex, oIndex, type) {
    const card = document.getElementById(`question-${qIndex}`);
    const items = card.querySelectorAll('.option-item');
    const input = items[oIndex].querySelector('input');

    if (type === 'mc') {
        items.forEach((item, idx) => {
            item.querySelector('input').checked = (idx === oIndex);
        });
    } else {
        input.checked = !input.checked;
    }
}

function submitAnswer(qIndex) {
    const q = quizData[qIndex];
    const card = document.getElementById(`question-${qIndex}`);
    const items = card.querySelectorAll('.option-item');
    const submitBtn = document.getElementById(`submit-btn-${qIndex}`);
    const rationaleBox = document.getElementById(`rationale-${qIndex}`);

    let userSelection = [];
    items.forEach((item, idx) => {
        if (item.querySelector('input').checked) {
            userSelection.push(idx);
        }
    });

    if (userSelection.length === 0) {
        alert("Please select at least one answer before submitting.");
        return;
    }

    // Check correctness
    let correctIndices = [];
    q.options.forEach((opt, idx) => {
        if (opt.correct) correctIndices.push(idx);
    });

    let isCorrect = false;
    if (q.type === 'mc') {
        isCorrect = (userSelection.length === 1 && userSelection[0] === correctIndices[0]);
    } else {
        // SATA: all correct must be selected and no incorrect selected
        const exactMatch = correctIndices.every(val => userSelection.includes(val)) && userSelection.every(val => correctIndices.includes(val));
        isCorrect = exactMatch;
    }

    userAnswers[qIndex] = isCorrect;
    if (!isCorrect) {
        missedQuestions.push(qIndex);
    }

    // Highlight options
    items.forEach((item, idx) => {
        if (q.options[idx].correct) {
            item.classList.add('correct');
        } else if (userSelection.includes(idx)) {
            item.classList.add('incorrect');
        }
        item.style.pointerEvents = 'none';
    });

    submitBtn.textContent = "Next Question";
    submitBtn.onclick = function() {
        navigateNext(qIndex + 1);
    };

    rationaleBox.classList.add('visible');
}

function submitCaseStudy(qIndex) {
    const sbar0 = document.getElementById('sbar-0').value.trim();
    const sbar1 = document.getElementById('sbar-1').value.trim();
    const sbar2 = document.getElementById('sbar-2').value.trim();
    const sbar3 = document.getElementById('sbar-3').value.trim();

    if (!sbar0 || !sbar1 || !sbar2 || !sbar3) {
        alert("Please fill out all sections of the SBAR report.");
        return;
    }

    userAnswers[qIndex] = true; // Case study completed
    document.getElementById(`submit-btn-${qIndex}`).style.display = 'none';
    document.getElementById(`rationale-${qIndex}`).classList.add('visible');
    
    // Disable inputs
    for (let i = 0; i < 4; i++) {
        document.getElementById(`sbar-${i}`).disabled = true;
    }

    setTimeout(showResults, 3000);
}

function navigateNext(nextIndex) {
    document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
    const nextCard = document.getElementById(`question-${nextIndex}`);
    if (nextCard) {
        nextCard.classList.add('active');
        updateProgress();
    } else {
        showResults();
    }
}

function updateProgress() {
    const activeCard = document.querySelector('.question-card.active');
    const total = quizData.length + 1;
    const currentIndex = parseInt(activeCard.id.split('-')[1]);
    const progress = ((currentIndex + 1) / total) * 100;
    document.getElementById('progressBar').style.width = `${progress}%`;
}

function showResults() {
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    document.getElementById('progressBar').style.width = '100%';

    const totalItems = quizData.length + 1; // 50 MC/SATA + 1 Case Study
    let correctCount = 0;
    for (let key in userAnswers) {
        if (userAnswers[key]) correctCount++;
    }

    const percentage = Math.round((correctCount / totalItems) * 100);
    document.getElementById('finalScoreDisplay').textContent = `${percentage}% (${correctCount}/${totalItems} Correct)`;

    let message = "";
    if (percentage >= 90) {
        message = "🌟 Outstanding, Jeffrey! You crushed this exam with 90%+ mastery! You are fully prepared for NCLEX success!";
    } else if (percentage >= 80) {
        message = "👏 Great job! Solid understanding of liver conditions and hepatitis. Review your rationales to lock in that 90%+ score.";
    } else {
        message = "💪 Good effort! Review Chapter 50 and your missed questions to boost your clinical reasoning.";
    }
    document.getElementById('scoreMessage').textContent = message;

    if (missedQuestions.length > 0) {
        document.getElementById('missedBtn').style.display = 'inline-block';
    }
}

function restartQuiz() {
    userAnswers = {};
    missedQuestions = [];
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('missedBtn').style.display = 'none';
    initQuiz();
}

function retakeMissed() {
    // Re-initialize showing only missed questions
    alert("Retake missed questions feature activated! (Reloading quiz to review missed items).");
    restartQuiz();
}

window.onload = initQuiz;
